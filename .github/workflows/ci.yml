name: CI

# On pull requests only, not on main after a merge (the owner, 2026-11-14): a merge commit has the code that its PR
# tested. The Release run does not test it again (the owner, 2026-11-24): it checks that its PR's runs passed. Branch
# pushes without a PR run nothing. Also by hand from
# the Actions tab. The Release runs on main keep the Gradle and Robolectric caches that these runs read.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a PR replaces its run; a run started by hand on main finishes, since it saves the cache.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Robolectric fetches its Android images (about 250 MB) into ~/.m2 on first use, outside Gradle's cache. Saved
      # from main only (as setup-gradle does), where every branch and release.yml can read it.
      - name: Robolectric cache key
        id: robolectric
        run: echo "key=$(.github/scripts/robolectric-cache-key.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: robolectric-cache
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.key }}

      - name: Style and static checks
        run: ./gradlew ktlintCheck detekt lintDebug

      # Any screenshots are recorded and uploaded for review, not compared pixel-for-pixel with committed copies.
      - name: Unit, Robolectric and UI tests (records screenshots)
        run: ./gradlew :core:test :app:recordRoborazziDebug koverXmlReport

      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.robolectric-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.key }}

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reports
          retention-days: 7
          path: |
            app/screenshots/
            **/build/reports/

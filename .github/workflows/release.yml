name: Release

# Publishes a GitHub Release with the signed APK (for sideloading), and uploads the AAB to Google Play's closed testing
# track (when the Play secret is set; see RELEASING.md). The AAB is also kept as a workflow artifact on the run.
# Start it by pushing a tag that matches the app's versionName (e.g. `git tag v0.2.4 && git push origin v0.2.4`),
# or from the Actions tab ("Run workflow") on main, which tags it for you.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time (a tag push and a hand-started run could otherwise both publish and upload to Play).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Secrets can't be tested in a step's `if`; this can.
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Before anything is set up: a release is made from main (or a tag on it), and only once.
      - name: Read the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          fail() { echo "::error::$1"; exit 1; }
          case "$GITHUB_REF" in
            "refs/tags/v$version")
              on_main=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status 2>&1) || true
              [ "$on_main" = identical ] || [ "$on_main" = behind ] || fail "Tag v$version isn't on main: $on_main" ;;
            refs/heads/main)
              # Started by hand: the tag is made by this run, so one already there was left by an earlier run.
              # (ls-remote: 0 found, 2 not found, anything else couldn't check.)
              status=0
              git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || status=$?
              [ "$status" != 0 ] || fail "Tag v$version already exists: delete it if a failed run left it"
              [ "$status" = 2 ] || fail "Couldn't check for a tag v$version (git ls-remote: $status)" ;;
            *)
              fail "$GITHUB_REF isn't main or the tag v$version (versionName in app/build.gradle.kts)" ;;
          esac
          release=$(gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/v$version" 2>/dev/null | head -1 | cut -d' ' -f2)
          case "$release" in
            404) ;;
            200) fail "Release v$version already exists" ;;
            *) fail "Couldn't check for an existing release (HTTP $release)" ;;
          esac

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Robolectric's Android images (about 250 MB, fetched into ~/.m2 on first use). Release runs on main keep the cache
      # that CI's pull request runs read: CI no longer runs on main (setup-gradle saves the Gradle cache here the same way).
      - name: Robolectric cache key
        id: robolectric
        run: echo "key=$(.github/scripts/robolectric-cache-key.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: robolectric-cache
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.key }}

      # The upload key lives in repository secrets. Without them the build falls back to the public development key,
      # which is fine for testing but must not be used for a real release (anyone could sign an "update").
      # Only MYTVLAUNCHER_KEYSTORE_BASE64 and MYTVLAUNCHER_KEYSTORE_PASSWORD are needed: the key password defaults to the keystore's
      # (keytool uses one password for both) and the alias to "mytvlauncher"; the other two secrets override them.
      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MYTVLAUNCHER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MYTVLAUNCHER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MYTVLAUNCHER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MYTVLAUNCHER_KEY_PASSWORD || secrets.MYTVLAUNCHER_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # A secret pasted with a newline at its end: the newline is not part of the password. (Through GITHUB_ENV,
            # Gradle never saw it, but keytool below would.)
            KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r')
            KEY_PASSWORD=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r')
            KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r')
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "MYTVLAUNCHER_KEYSTORE=$RUNNER_TEMP/release.keystore"
              echo "MYTVLAUNCHER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "MYTVLAUNCHER_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "SIGNED_WITH=release" >> "$GITHUB_ENV"
            # A clear message before the build, in place of Gradle's "Failed to read key ... null": the aliases in the
            # keystore (names only, no passwords), and whether the one asked for is among them.
            listing=$(keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" 2>&1 || true)
            aliases=$(printf '%s\n' "$listing" | sed -n 's/^\([^,]*\), .*PrivateKeyEntry.*$/\1/p')
            if [ -z "$aliases" ]; then
              # keytool's own message (it never shows the password), and the file's size and first bytes' type.
              printf '%s\n' "$listing" | grep -v '^Picked up' | head -5
              echo "Keystore file: $(wc -c < "$RUNNER_TEMP/release.keystore") bytes, $(file -b "$RUNNER_TEMP/release.keystore")"
              echo "::error::The keystore did not open with MYTVLAUNCHER_KEYSTORE_PASSWORD, or it holds no key."
              exit 1
            fi
            # With no MYTVLAUNCHER_KEY_ALIAS, the keystore's only key is used.
            if [ -z "$KEY_ALIAS" ]; then
              if [ "$(printf '%s\n' "$aliases" | wc -l)" -ne 1 ]; then
                echo "::error::The keystore holds more than one key: set MYTVLAUNCHER_KEY_ALIAS to one of: $(printf '%s ' $aliases)"
                exit 1
              fi
              KEY_ALIAS=$aliases
            elif ! printf '%s\n' "$aliases" | grep -Fixq -- "$KEY_ALIAS"; then
              echo "::error::No key named as MYTVLAUNCHER_KEY_ALIAS in the keystore. Its keys: $(printf '%s ' $aliases)"
              exit 1
            fi
            echo "MYTVLAUNCHER_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            # Reading the private key needs the key's own password: a wrong one is Gradle's "null".
            if ! keytool -certreq -alias "$KEY_ALIAS" -keystore "$RUNNER_TEMP/release.keystore" \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" > /dev/null 2>&1; then
              echo "::error::The key did not open with MYTVLAUNCHER_KEY_PASSWORD (or, if it is not set, MYTVLAUNCHER_KEYSTORE_PASSWORD)."
              exit 1
            fi
          else
            echo "::warning::No signing secrets set: this release is signed with the public development key."
            echo "SIGNED_WITH=development" >> "$GITHUB_ENV"
          fi

      # Separate steps, as in CI: run together (org.gradle.parallel), lint takes the CPU the UI tests' waits need.
      - name: Check
        run: ./gradlew ktlintCheck detekt lintDebug

      - name: Test
        run: ./gradlew :core:test :app:testDebugUnitTest

      - uses: actions/cache/save@v4
        if: steps.robolectric-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.key }}

      - name: Build APK and app bundle
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Collect files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.version.outputs.version }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MyTVLauncher-$v.apk"
          (cd dist && sha256sum MyTVLauncher-*.apk > SHA256SUMS.txt)
          mkdir -p play
          cp app/build/outputs/bundle/release/app-release.aab "play/MyTVLauncher-$v.aab"
          # Kept with the bundle, for the Play upload workflow should this release's own upload fail.
          mapping=app/build/outputs/mapping/release/mapping.txt
          [ ! -f "$mapping" ] || cp "$mapping" play/
          # Release notes: this version's section of CHANGELOG.md, and any versions since the last release.
          .github/scripts/release-notes.sh "$v" > dist/notes.md
          if [ "$SIGNED_WITH" = "development" ]; then
            printf '\n> **Test build:** signed with the public development key. Not for general distribution.\n' >> dist/notes.md
          fi
          printf '\n**Install on Android TV:** download the APK and sideload it (e.g. with the Downloader app or `adb install`).\n' >> dist/notes.md

      # If the upload below is off or fails: on the run's page under Artifacts, kept 90 days (see RELEASING.md › Google Play).
      - uses: actions/upload-artifact@v6
        with:
          name: MyTVLauncher-${{ steps.version.outputs.version }}-play-bundle
          path: |
            play/*.aab
            play/mapping.txt
          retention-days: 90

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MyTVLauncher ${{ steps.version.outputs.version }}
          body_path: dist/notes.md
          prerelease: ${{ env.SIGNED_WITH == 'development' || startsWith(steps.version.outputs.version, '0.') }}
          files: |
            dist/MyTVLauncher-*.apk
            dist/SHA256SUMS.txt

      # Google Play: the bundle goes to closed testing ("Closed testing - Alpha" in Play Console, "alpha" here), after
      # the GitHub release so a Play problem can't hold that up. Skipped without the service account secret, and for a
      # build signed with the development key, which Play would refuse.
      # The release goes to testers after Play's review of it; set the repository variable PLAY_RELEASE_STATUS to
      # "draft" to send each one by hand from Play Console instead.
      # If this fails after the GitHub release (e.g. Play unavailable): the Play upload workflow (see RELEASING.md).
      - name: Upload to Google Play (closed testing)
        if: env.HAS_PLAY_ACCOUNT == 'true' && env.SIGNED_WITH == 'release'
        uses: ./.github/actions/play-upload
        with:
          service-account-json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          version: ${{ steps.version.outputs.version }}
          bundle: play/MyTVLauncher-${{ steps.version.outputs.version }}.aab
          mapping: play/mapping.txt
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          notes-language: ${{ vars.PLAY_NOTES_LANGUAGE || 'en-GB' }}
